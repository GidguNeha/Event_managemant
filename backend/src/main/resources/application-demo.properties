spring.datasource.url=${DB_URL:jdbc:h2:file:./data/eventhub;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
app.demo.organizer-password=${DEMO_ORGANIZER_PASSWORD:Organizer123!}
app.demo.admin-password=${DEMO_ADMIN_PASSWORD:Admin12345!}
