<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organizer studio — EventHub</title><link rel="stylesheet" href="assets/styles.css"><script defer src="assets/app.js"></script></head><body data-page="dashboard"><header id="site-header"></header><main class="page-shell"><div class="page-intro"><span class="eyebrow">ORGANIZER STUDIO</span><h1>Make something <span>happen.</span></h1><p>Create your next event and welcome your attendees.</p></div><div id="organizer-stats" class="stats-grid"></div><div class="dashboard-layout"><form id="event-form" class="form-card"><h2>Create an event</h2><label>Event name<input name="name" maxlength="160" required></label><label>Description<textarea name="description" rows="4" required></textarea></label><div class="form-pair"><label>Category<select name="category" required><option value="">Choose one</option><option>Music</option><option>Arts</option><option>Food</option><option>Community</option><option>Technology</option><option>Wellness</option><option>Other</option></select></label><label>Date<input name="eventDate" type="date" required></label></div><div class="form-pair"><label>Start time<input name="startTime" type="time" required></label><label>Venue<input name="venue" maxlength="200" required></label></div><label>Image URL <span class="muted">(optional)</span><input name="imageUrl" type="url" maxlength="1000" placeholder="https://…"></label><div class="form-pair"><label>Price per ticket (₹)<input name="ticketPrice" type="number" min="0" step="0.01" required></label><label>Ticket capacity<input name="totalTickets" type="number" min="1" max="1000000" required></label></div><button class="button full-width">Publish event</button><div class="form-message" role="status"></div></form><section><div class="section-heading"><h2>Your events</h2></div><div id="organizer-events" class="stack-list"></div></section></div></main><footer id="site-footer"></footer></body></html>
